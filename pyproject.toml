[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etygraph"
version = "0.1.0"
description = "Learner-facing etymology graph pipeline for French verbs and related English words."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
etygraph = "etygraph.cli:main"

[tool.setuptools.packages.find]
include = ["etygraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
